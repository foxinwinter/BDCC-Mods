name: Build PhoenixRising + CheatMenu

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read versions
        id: versions
        run: |
          echo "pr=$(jq -r .phoenixRising versions.json)" >> $GITHUB_OUTPUT
          echo "cm=$(jq -r .cheatMenu versions.json)" >> $GITHUB_OUTPUT

      - name: Build PhoenixRising
        run: |
          tmp=$(mktemp -d)
          find . -type f \( -name '*.gd' -o -name '*.tscn' -o -name '*.json' \) \
            ! -path '*/\.github/*' ! -path '*/CheatMenu/*' | while read -r f; do
            rel="${f#./}"
            mkdir -p "$tmp/Modules/PhoenixRising/$(dirname "$rel")"
            cp "$f" "$tmp/Modules/PhoenixRising/$rel"
          done
          cd "$tmp"
          zip -r "$OLDPWD/PhoenixRising_v${{ steps.versions.outputs.pr }}.zip" .

      - name: Build CheatMenu
        run: |
          tmp=$(mktemp -d)
          find CheatMenu -type f \( -name '*.gd' -o -name '*.tscn' -o -name '*.json' \) ! -path '*/\.github/*' | while read -r f; do
            rel="${f#CheatMenu/}"
            mkdir -p "$tmp/Modules/CheatMenu/$(dirname "$rel")"
            cp "$f" "$tmp/Modules/CheatMenu/$rel"
          done
          cd "$tmp"
          zip -r "$OLDPWD/CheatMenu_v${{ steps.versions.outputs.cm }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: mods
          path: |
            PhoenixRising_v${{ steps.versions.outputs.pr }}.zip
            CheatMenu_v${{ steps.versions.outputs.cm }}.zip

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read versions
        id: versions
        run: |
          echo "pr=$(jq -r .phoenixRising versions.json)" >> $GITHUB_OUTPUT
          echo "cm=$(jq -r .cheatMenu versions.json)" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          name: mods
          path: .

      - name: Create Release
        run: |
          TAG="v${{ steps.versions.outputs.pr }}"
          NOTES=$(cat <<EOF
          Updated: phoenixRising to ${{ steps.versions.outputs.pr }}
          Updated: cheatMenu     to ${{ steps.versions.outputs.cm }}
          EOF
          )
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push --delete origin "$TAG" 2>/dev/null || true
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "BDCC-Mods $TAG" \
            --notes "$NOTES" \
            PhoenixRising_v${{ steps.versions.outputs.pr }}.zip \
            CheatMenu_v${{ steps.versions.outputs.cm }}.zip
        env:
          GH_TOKEN: ${{ github.token }}

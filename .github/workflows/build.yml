name: Build PhoenixRising + CheatMenu

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: phoenixRising

      - uses: actions/checkout@v4
        with:
          repository: BDCC-Mods/CheatMenu
          path: cheatMenu

      - name: Build PhoenixRising
        run: |
          tmp=$(mktemp -d)
          find phoenixRising -type f \( -name '*.gd' -o -name '*.tscn' -o -name '*.json' \) ! -path '*/\.github/*' | while read -r f; do
            rel="${f#phoenixRising/}"
            mkdir -p "$tmp/Modules/PhoenixRising/$(dirname "$rel")"
            cp "$f" "$tmp/Modules/PhoenixRising/$rel"
          done
          cd "$tmp"
          zip -r "$OLDPWD/PhoenixRising.zip" .

      - name: Build CheatMenu
        run: |
          tmp=$(mktemp -d)
          find cheatMenu -type f \( -name '*.gd' -o -name '*.tscn' -o -name '*.json' \) ! -path '*/\.github/*' | while read -r f; do
            rel="${f#cheatMenu/}"
            mkdir -p "$tmp/Modules/CheatMenu/$(dirname "$rel")"
            cp "$f" "$tmp/Modules/CheatMenu/$rel"
          done
          cd "$tmp"
          zip -r "$OLDPWD/CheatMenu.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: mods
          path: |
            PhoenixRising.zip
            CheatMenu.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mods

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PhoenixRising.zip
            CheatMenu.zip
          generate_release_notes: true

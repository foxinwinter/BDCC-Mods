name: Build CheatMenu

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: |
          tmp=$(mktemp -d)
          find . -type f \( -name '*.gd' -o -name '*.tscn' -o -name '*.json' \) ! -path '*/\.github/*' | while read -r f; do
            rel="${f#./}"
            mkdir -p "$tmp/Modules/CheatMenu/$(dirname "$rel")"
            cp "$f" "$tmp/Modules/CheatMenu/$rel"
          done
          cd "$tmp"
          zip -r "$OLDPWD/CheatMenu.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: CheatMenu
          path: CheatMenu.zip

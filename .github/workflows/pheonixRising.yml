name: Build PhoenixRising

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: |
          tmp=$(mktemp -d)
          find . -type f \( -name '*.gd' -o -name '*.tscn' -o -name '*.json' \) | while read -r f; do
            rel="${f#./}"
            mkdir -p "$tmp/Modules/PhoenixRising/$(dirname "$rel")"
            cp "$f" "$tmp/Modules/PhoenixRising/$rel"
          done
          cd "$tmp"
          zip -r "$OLDPWD/PhoenixRising.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: PhoenixRising
          path: PhoenixRising.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PhoenixRising

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: PhoenixRising.zip
          generate_release_notes: true
